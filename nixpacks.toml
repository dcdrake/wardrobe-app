[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
    "cd apps/frontend && NODE_ENV=development npm ci",
    "curl -LsSf https://astral.sh/uv/install.sh | sh && export PATH=$HOME/.local/bin:$PATH && cd apps/backend && uv sync --frozen",
]

[phases.build]
cmds = [
    "cd apps/frontend && NODE_ENV=development npm ci && npx vite build",
    "export PATH=$HOME/.local/bin:$PATH && cd apps/backend && uv run python manage.py collectstatic --noinput",
]

[start]
cmd = "export PATH=$HOME/.local/bin:$PATH && cd apps/backend && uv run python manage.py migrate --noinput && uv run gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2 --timeout 120"
